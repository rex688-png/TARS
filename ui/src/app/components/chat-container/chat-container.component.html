@for (msg of chat; track msg.index) {
  <div class="chat-entry" [ngClass]="getEventClass(msg.role, msg.message)" [class.tars-message]="msg.role === 'covas' || msg.role === 'plugin'" [class.commander-message]="msg.role === 'cmdr'">
    <span class="timestamp">{{ msg.timestamp | date:'HH:mm:ss' }}</span>
    <span class="prefix" [style.color]="msg.display_color || getLogColor(msg.role)">{{ getDisplayName(msg) }}</span>
    <span class="message">{{ formatMessage(msg) }}</span>
    @if (msg.processingText) {
      <span class="processing-text">{{ msg.processingText }}</span>
    }
  </div>
}
@if (searchDetails && !limit) {
  <details class="search-result-card">
    <summary><span>SEARCH RESULT</span><strong>{{ searchTitle }}</strong><em>View details</em></summary>
    <pre>{{ searchDetails }}</pre>
  </details>
}
