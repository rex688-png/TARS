name: Gitleaks full-history audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gitleaks-audit.yml

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        shell: bash
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan all branches and tags
        shell: bash
        run: |
          gitleaks git --redact --verbose --log-opts="--all" .
