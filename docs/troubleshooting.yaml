# Retained for the legacy interactive reader, which is excluded from the public site.
# Current public guide: troubleshooting.md
- Question: Did TARS start from a reviewed package?
  Yes:
    - Solution: Check provider registration and the failing stage in Settings → Diagnostics.
  No:
    - Error: Startup or security warning
      Explanation: A detection is not automatically a false positive. Keep security protection enabled.
      Solution: Verify the reviewed build and checksums, record the sanitized error, and use TARS GitHub Issues. Never post credentials or private profiles.
